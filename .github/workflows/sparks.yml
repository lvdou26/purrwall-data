name: sparks
# Hourly market-trend snapshot -> purrwall.xyz/api/sparks-ingest.
# Needs one repo secret: SPARKS_TOKEN (the ingest token).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: sparks
  cancel-in-progress: false

permissions:
  contents: write # the run commits its hourly history sample back to this repo

jobs:
  sparks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned: after the account rename, scheduled runs still reported the
      # old owner name as github.repository, and a checkout through the old
      # name follows a redirect anyone could break by registering that name.
      - uses: actions/checkout@v4
        with:
          repository: lvdou26/purrwall-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch-sparks.mjs
        env:
          SPARKS_TOKEN: ${{ secrets.SPARKS_TOKEN }}
      # Hyperliquid publishes no OI history and no listing dates, so these
      # samples exist only if we keep taking them — the commit log IS the
      # series. Runs even when the sparks publish failed (`if: always()`):
      # the context sample was banked before the long candle sweep and is
      # still good. Rebase-then-push so a slow run never loses to a manual
      # commit; a rejected push is logged, not fatal — the next hour recovers.
      - name: Commit history sample
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # `|| true`: a run that died before recordHistory leaves no history/
          # at all, and `if: always()` must not turn that into a second red X.
          git add history || true
          if git diff --cached --quiet; then
            echo 'no history change'
            exit 0
          fi
          git commit -m "history: ctx sample $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main || true
          git push || echo 'push rejected — next run will carry it'
